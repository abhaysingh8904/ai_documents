name: AI Document CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aidocument
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test backend
        run: ./mvnw clean test -Dtest=AiDocumentApplicationTests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/aidocument?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: aidocument
          DB_USERNAME: root
          DB_PASSWORD: root

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          JWT_SECRET: testsecretkeytestsecretkeytestsecretkeytestsecretkey
          GEMINI_API_KEY: dummy
          PINECONE_API_KEY: dummy
          PINECONE_INDEX_NAME: dummy
          PINECONE_ENVIRONMENT: dummy

      - name: Print test failure report
        if: failure()
        run: |
          echo "========== SUREFIRE REPORTS =========="
          find target/surefire-reports -name "*.txt" -exec echo "--- {} ---" \; -exec cat {} \;

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build