spring.application.name=ai-document

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_document}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

gemini.api.key=${GEMINI_API_KEY:}

jwt.secret=${JWT_SECRET:my_super_secret_jwt_key_123456789_for_local_testing}
jwt.expiration=86400000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

rate.limit.max-requests=8
rate.limit.window-minutes=60

pinecone.api.key=${PINECONE_API_KEY:}
pinecone.index.host=${PINECONE_INDEX_HOST:}
pinecone.namespace=${PINECONE_NAMESPACE:ai-document}

gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.embedding.output-dimensions=${GEMINI_EMBEDDING_OUTPUT_DIMENSIONS:1024}